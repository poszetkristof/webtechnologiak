<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Playing Cards</title>
    <link rel="stylesheet" href="cards-flex.css" />
  </head>
  <body>
    <!-- a kártyák konténere (flexbox) -->
    <div class="cards">
      <!-- data-*: saját adat; data-suit = szín, data-rank = érték -->
      <!-- a span-ek üresek, a tartalmukat a CSS adja (::before) -->
      <!-- Pikk ász (♠) -->
      <div class="card" data-suit="spades" data-rank="A">
        <span class="topLeft">
          <span class="rank"></span>
          <br />
          <span class="suit"></span>
        </span>
        <span class="center suit"></span>
        <!-- jobb alsó sarok: fejjel lefelé (rotate) -->
        <span class="bottomRight">
          <span class="rank"></span>
          <br />
          <span class="suit"></span>
        </span>
      </div>

      <!-- Kőr ász (♥) -->
      <div class="card" data-suit="hearts" data-rank="A">
        <span class="topLeft">
          <span class="rank"></span>
          <br />
          <span class="suit"></span>
        </span>
        <span class="center suit"></span>
        <span class="bottomRight">
          <span class="rank"></span>
          <br />
          <span class="suit"></span>
        </span>
      </div>

      <!-- Treff ász (♣) -->
      <div class="card" data-suit="clubs" data-rank="A">
        <span class="topLeft">
          <span class="rank"></span>
          <br />
          <span class="suit"></span>
        </span>
        <span class="center suit"></span>
        <span class="bottomRight">
          <span class="rank"></span>
          <br />
          <span class="suit"></span>
        </span>
      </div>

      <!-- Káró ász (♦) -->
      <div class="card" data-suit="diamonds" data-rank="A">
        <span class="topLeft">
          <span class="rank"></span>
          <br />
          <span class="suit"></span>
        </span>
        <span class="center suit"></span>
        <span class="bottomRight">
          <span class="rank"></span>
          <br />
          <span class="suit"></span>
        </span>
      </div>
    </div>
  </body>
</html>
